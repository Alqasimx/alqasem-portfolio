    <linearGradient id="router" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#137c83"/><stop offset="1" stop-color="#0a4c62"/></linearGradient>
    <linearGradient id="switch" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e58b42"/><stop offset="1" stop-color="#b96035"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#16485c" flood-opacity=".17"/></filter>
  </defs>
