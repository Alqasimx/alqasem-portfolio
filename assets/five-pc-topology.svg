<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">شبكة Router Security بخمسة أجهزة</title>
  <desc id="desc">راوتر R1 وسويتش SW1 وخمسة أجهزة PC بعناوين 192.168.10.11 إلى 192.168.10.15</desc>
  <defs>
