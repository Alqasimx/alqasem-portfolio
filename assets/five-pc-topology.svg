  <text x="700" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15384e">Topology 01 — شبكة تدريب Router Security</text>
  <text x="700" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#62808b">كل الأجهزة في الشبكة 192.168.10.0/24 والبوابة هي R1</text>
